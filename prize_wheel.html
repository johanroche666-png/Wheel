<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>பரிசுச் சக்கரம்</title>
<style>
:root{--bg:#FFFFFF;--fg:#1A1A1A;--muted:#5F6B73;--card:#F3F5F7;--line:#C9D1D6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15191C;--fg:#F1F3F4;--muted:#A3AEB5;--card:#20262A;--line:#3A444A}}
:root[data-theme="dark"]{--bg:#15191C;--fg:#F1F3F4;--muted:#A3AEB5;--card:#20262A;--line:#3A444A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans Tamil","Latha",sans-serif;text-align:center;padding:16px 12px 32px}
h1{font-size:22px;font-weight:500;margin:8px 0 4px}
p.sub{margin:0 0 8px;color:var(--muted);font-size:14px}
canvas{display:block;margin:0 auto;max-width:100%}
button{font-size:18px;font-weight:500;padding:12px 40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;margin-top:8px}
button:disabled{opacity:.5}
#r{margin:14px 0 0;font-size:24px;font-weight:500;min-height:34px}
</style>
</head>
<body>
<h1>பரிசுச் சக்கரம்</h1>
<p class="sub">சுற்று பொத்தானை அழுத்துங்கள்</p>
<canvas id="w"></canvas>
<button id="b">சுற்று</button>
<p id="r"></p>
<script>
var cv=document.getElementById('w'),x=cv.getContext('2d');
var N=50,SEG=360/N,TARGET=25,rot=0,busy=false;
var pal=['#D9473F','#C9871A','#1D9E75','#2E78C7','#6F66D6'];
var S=380,CX,CY,R;
function size(){
var w=Math.min(window.innerWidth-24,440);S=w;var d=window.devicePixelRatio||1;
cv.width=Math.round(S*d);cv.height=Math.round(S*d*1.05);cv.style.width=S+'px';cv.style.height=Math.round(S*1.05)+'px';
x.setTransform(d,0,0,d,0,0);
CX=S/2;CY=S*0.5+S*0.05;R=S*0.46;draw();}
function draw(){
x.clearRect(0,0,S,S*1.1);
x.save();x.translate(CX,CY);x.rotate(rot*Math.PI/180);
var fs=Math.max(10,Math.round(R*0.065));
for(var i=0;i<N;i++){
var a0=(-90+i*SEG)*Math.PI/180,a1=(-90+(i+1)*SEG)*Math.PI/180;
x.beginPath();x.moveTo(0,0);x.arc(0,0,R,a0,a1);x.closePath();
x.fillStyle=pal[i%5];x.fill();
x.strokeStyle='rgba(255,255,255,0.5)';x.lineWidth=0.5;x.stroke();
x.save();x.rotate((a0+a1)/2);x.fillStyle='#FFFFFF';x.font='500 '+fs+'px sans-serif';x.textAlign='right';x.textBaseline='middle';x.fillText(String(i+1),R-R*0.04,0);x.restore();}
x.beginPath();x.arc(0,0,R,0,6.2832);x.strokeStyle='#8A99A3';x.lineWidth=3;x.stroke();
x.beginPath();x.arc(0,0,R*0.12,0,6.2832);x.fillStyle='#FFFFFF';x.fill();x.strokeStyle='#8A99A3';x.lineWidth=2;x.stroke();
x.restore();
var ty=CY-R;
x.beginPath();x.moveTo(CX-14,ty-26);x.lineTo(CX+14,ty-26);x.lineTo(CX,ty+6);x.closePath();
x.fillStyle='#222222';x.fill();x.strokeStyle='#FFFFFF';x.lineWidth=1.5;x.stroke();}
size();window.addEventListener('resize',size);
var btn=document.getElementById('b'),res=document.getElementById('r');
btn.onclick=function(){
if(busy)return;busy=true;btn.disabled=true;res.textContent='';
var need=(((-(TARGET-0.5)*SEG)%360)+360)%360;
var cur=((rot%360)+360)%360;
var delta=(((need-cur)%360)+360)%360+360*6;
var start=rot,dur=5000,t0=performance.now();
function step(t){
var p=Math.min((t-t0)/dur,1),e=1-Math.pow(1-p,3);
rot=start+delta*e;draw();
if(p<1){requestAnimationFrame(step);}
else{busy=false;btn.disabled=false;res.textContent='வெற்றி எண்: '+TARGET;}}
requestAnimationFrame(step);};
</script>
</body>
</html>
